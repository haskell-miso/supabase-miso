<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notes: miso + Supabase</title>
    <link rel="icon" href="data:,">
    <style>
      :root {
        --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280;
        --line: #e5e7eb; --accent: #3ecf8e; --accent-text: #0b3d27;
        --info: #eef6ff; --problem: #fdecec; --problem-text: #9b1c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121417; --card: #1c1f24; --text: #e6e8eb; --muted: #9aa1ab;
          --line: #2d3239; --info: #1b2a3a; --problem: #3a1d1d; --problem-text: #f5b4b4;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text);
             font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      .app { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
      header h1 { margin: 0; font-size: 28px; }
      .tagline { margin: 4px 0 24px; color: var(--muted); }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
      .card h2 { margin: 0 0 16px; font-size: 20px; }
      label { display: block; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
      input:not([type=checkbox]):not([type=file]) {
        display: block; width: 100%; margin-top: 4px; padding: 9px 12px; font: inherit; color: var(--text);
        background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
      button { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid transparent;
               background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer; }
      button.secondary { background: transparent; color: var(--text); border-color: var(--line); }
      button.link { background: none; border: none; padding: 0 4px; color: var(--muted); font-weight: 400; }
      button:disabled { opacity: .5; cursor: default; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row input { margin-top: 0 !important; }
      .or { text-align: center; color: var(--muted); margin: 16px 0; font-size: 14px; }
      .providers { display: grid; gap: 8px; }
      .status { padding: 10px 14px; border-radius: 8px; margin: 0 0 16px; background: var(--info); }
      .status.problem { background: var(--problem); color: var(--problem-text); }
      .account { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      .badge { margin-left: 8px; padding: 2px 8px; border-radius: 99px; font-size: 12px;
               border: 1px solid var(--line); color: var(--muted); }
      .search { margin: 12px 0 !important; }
      .notes { list-style: none; margin: 0; padding: 0; }
      .note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
      .note .title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .note.done .title { text-decoration: line-through; color: var(--muted); }
      .file { font-size: 14px; }
      .file a { color: inherit; }
      .attach, .note .link { margin: 0; font-size: 14px; cursor: pointer; }
      input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
      .attach input { display: none; }
      .empty { color: var(--muted); text-align: center; margin: 24px 0 8px; }
    </style>
  </head>
  <body>
    <!-- The supabase client (globalThis.supabase, which supabase-miso uses),
         and then the app. -->
    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm";
      import { SUPABASE_URL, SUPABASE_KEY } from "./config.js";
      globalThis.supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
      // whether the project has GitHub sign-in (supabase/config.toml), for
      // the app's GitHub button
      try {
        const settings = await fetch(SUPABASE_URL + "/auth/v1/settings", { headers: { apikey: SUPABASE_KEY } });
        globalThis.supabaseGitHub = !!(await settings.json()).external?.github;
      } catch (e) {
        globalThis.supabaseGitHub = false;
      }
      const app = document.createElement("script");
      app.src = "index.js";
      document.body.appendChild(app);
    </script>
  </body>
</html>
